name: branch-booking

# Only the application and the mail inbox are published on the host. Postgres and the
# backend are reachable inside the Docker network only, so this stack never clashes with
# a database you already run locally. See docker-compose.dev.yml to publish more.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${DB_PASSWORD:-booking}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U booking -d booking"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "${MAILHOG_PORT:-8025}:8025"
    restart: unless-stopped

  backend:
    build: ./backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/booking
      DB_USER: booking
      DB_PASSWORD: ${DB_PASSWORD:-booking}
      MAIL_HOST: mailhog
      MAIL_PORT: "1025"
      MAIL_ENABLED: "true"
      PUBLIC_BASE_URL: http://localhost:${APP_PORT:-8081}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${APP_PORT:-8081}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: