name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booking
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking -d booking"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw
      # Environment variables override the H2 settings in application-test.yml,
      # so the whole suite, including the concurrency test, runs on real Postgres.
      - name: Build and test against PostgreSQL
        run: ./mvnw -B verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/booking
          SPRING_DATASOURCE_USERNAME: booking
          SPRING_DATASOURCE_PASSWORD: booking
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false

  stack:
    name: full stack smoke test
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Build images and start the whole stack
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Smoke test through the public entry point
        run: |
          set -eu
          base=http://localhost:8081

          curl -fsS "$base/" | grep "<app-root" > /dev/null
          curl -fsS "$base/api/v1/branches" | grep "Sandton" > /dev/null
          curl -fsS "$base/v3/api-docs" | grep "/api/v1/bookings" > /dev/null
          curl -fsSL "$base/swagger-ui.html" | grep -i "swagger" > /dev/null

          # security headers are present, and the page has no inline handler that the CSP would block
          headers=$(curl -fsSI "$base/")
          echo "$headers" | grep -i "content-security-policy" > /dev/null
          echo "$headers" | grep -i "x-content-type-options: nosniff" > /dev/null
          if curl -fsS "$base/" | grep -i "onload=" > /dev/null; then echo "inline onload handler found"; exit 1; fi

          # next weekday that is at least 3 days away
          date=$(date -d "+3 days" +%F)
          for attempt in $(seq 1 14); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$base/api/v1/branches/1/slots?date=$date")
            [ "$code" = "200" ] && break
            date=$(date -d "$date +1 day" +%F)
          done
          echo "using $date"
          curl -fsS "$base/api/v1/holidays?year=2026" | grep "Local Government Elections Day" > /dev/null

          body="{\"branchId\":1,\"date\":\"$date\",\"startTime\":\"09:00\",\"customerName\":\"CI Smoke\",\"customerEmail\":\"ci-smoke@example.com\"}"

          first=$(curl -s -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" -d "$body" "$base/api/v1/bookings")
          second=$(curl -s -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" -d "$body" "$base/api/v1/bookings")
          echo "first booking: $first, second booking: $second"
          [ "$first" = "201" ]
          [ "$second" = "409" ]

          # a retry with the same Idempotency-Key returns the original booking instead of failing
          key=$(cat /proc/sys/kernel/random/uuid)
          idem="{\"branchId\":1,\"date\":\"$date\",\"startTime\":\"10:00\",\"customerName\":\"CI Retry\",\"customerEmail\":\"ci-retry@example.com\"}"
          r1=$(curl -s -H "Content-Type: application/json" -H "Idempotency-Key: $key" -d "$idem" "$base/api/v1/bookings")
          r2=$(curl -s -H "Content-Type: application/json" -H "Idempotency-Key: $key" -d "$idem" "$base/api/v1/bookings")
          ref1=$(echo "$r1" | grep -o '"reference":"[^"]*"')
          ref2=$(echo "$r2" | grep -o '"reference":"[^"]*"')
          echo "first: $ref1, retry: $ref2"
          [ -n "$ref1" ]
          [ "$ref1" = "$ref2" ]

          # the confirmation email is sent asynchronously, so give it a moment to arrive
          found=no
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8025/api/v2/messages | grep "ci-smoke@example.com" > /dev/null; then
              found=yes
              break
            fi
            sleep 1
          done
          echo "confirmation email delivered to MailHog: $found"
          [ "$found" = "yes" ]

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v