name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booking
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking -d booking"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw
      # Environment variables override the H2 settings in application-test.yml,
      # so the whole suite, including the concurrency test, runs on real Postgres.
      - name: Build and test against PostgreSQL
        run: ./mvnw -B verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/booking
          SPRING_DATASOURCE_USERNAME: booking
          SPRING_DATASOURCE_PASSWORD: booking
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver