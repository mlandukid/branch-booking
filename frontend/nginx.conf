# http-level settings. This file is included inside the http block.
server_tokens off;
limit_req_status 429;

# Only POST requests count against the write limit. An empty key is never limited.
map $request_method $write_key {
    default "";
    POST    $binary_remote_addr;
    PATCH   $binary_remote_addr;
    DELETE  $binary_remote_addr;
}
limit_req_zone $write_key zone=writes:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=reads:10m rate=120r/m;

# The application gets a strict policy. The API documentation needs a looser one to run.
map $uri $csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    "~^/(swagger-ui|v3/api-docs)" "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 16k;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # The API is served from the same origin as the UI, so the browser never needs CORS.
    location /api/ {
        limit_req zone=writes burst=10 nodelay;
        limit_req zone=reads burst=60 nodelay;

        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # API documentation (Swagger UI and the OpenAPI spec).
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Branch photos keep their file names, so they are cached for a week, not a year.
    location ^~ /branches/ {
        expires 7d;
        try_files $uri =404;
    }

    # Build output is fingerprinted, so it can be cached for a long time.
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        expires 1y;
        try_files $uri =404;
    }

    # Single page app: any other route serves index.html, which must never be cached.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}