spring:
  datasource:
    url: jdbc:h2:mem:booking;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

booking:
  mail:
    enabled: false
  # Integration tests pick dates relative to today, so they must not depend on the holiday calendar.
  # The closure itself is covered by unit tests with a fixed clock.
  closed-on-public-holidays: false