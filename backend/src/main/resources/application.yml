spring:
  application:
    name: branch-booking
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking}
    username: ${DB_USER:booking}
    password: ${DB_PASSWORD:booking}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    execution:
      shutdown:
        await-termination: true
        await-termination-period: 20s
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  shutdown: graceful

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

booking:
  timezone: ${BOOKING_TIMEZONE:Africa/Johannesburg}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8081}
  change-cutoff-hours: ${CHANGE_CUTOFF_HOURS:2}
  retention-days: ${RETENTION_DAYS:90}
  outbox:
    poll-ms: ${OUTBOX_POLL_MS:1000}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:8}
    backoff-seconds: ${OUTBOX_BACKOFF_SECONDS:30}
    batch-size: 20
    retention-days: ${OUTBOX_RETENTION_DAYS:30}
  admin:
    api-key: ${ADMIN_API_KEY:}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:no-reply@branchbooking.local}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}